resources:
  jobs:
    YT_EarthQuake_End_End:
      name: YT_EarthQuake_End_End_prod
      tasks:
        - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: ../src/notebooks/Ingestion_Bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_Silver_Earthquake
          depends_on:
            - task_key: Ingestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_earthquake_etl.id}
        - task_key: Earthquake_dashboard
          depends_on:
            - task_key: Bronze_Silver_Earthquake
          dashboard_task:
            subscription: {}
            warehouse_id: 50ce076b0628663d
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      run_as:
        service_principal_name: ${var.spn_id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
