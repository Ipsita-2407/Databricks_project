# This is a Databricks asset bundle definition for databricks_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_project_bundle
  uuid: 7076d552-7d7d-46af-80f8-5e5d9ccf7f98

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f9b78590-64e5.cloud.databricks.com
    variables:
      catalog: first_project
      schema: dev
      warehouse_id: 50ce076b0628663d
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-f9b78590-64e5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/289ipsita289@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/289ipsita289@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: first_project_prod
      schema: prod
      warehouse_id: 50ce076b0628663d
    permissions:
      - user_name: 289ipsita289@gmail.com
        level: CAN_MANAGE
